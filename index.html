<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AP Agency Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#020617;color:white}
.hidden{display:none!important}
input,select,button{font:inherit}
</style>
</head>

<body>

<div id="toast" class="fixed top-4 right-4 z-50"></div>

<main class="max-w-md mx-auto min-h-screen bg-slate-900">

<!-- LOGIN / REGISTER -->

<section id="auth" class="min-h-screen p-6 flex flex-col justify-center">

    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold">AP Agency</h1>
        <p class="text-slate-400 mt-2">Worker Wallet</p>
    </div>

    <div class="flex bg-slate-800 rounded-xl p-1 mb-6">
        <button id="loginTab"
            onclick="showTab('login')"
            class="flex-1 py-3 rounded-lg bg-blue-600 font-bold">
            Login
        </button>

        <button id="registerTab"
            onclick="showTab('register')"
            class="flex-1 py-3 rounded-lg text-slate-400">
            Register
        </button>
    </div>

    <form id="loginForm" onsubmit="login(event)" class="space-y-4">

        <input id="loginEmail"
            type="email"
            required
            placeholder="Email address"
            class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700">

        <input id="loginPassword"
            type="password"
            required
            placeholder="Password"
            class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700">

        <button class="w-full p-3.5 rounded-xl bg-blue-600 font-bold">
            Login
        </button>

    </form>

    <form id="registerForm"
        onsubmit="register(event)"
        class="hidden space-y-4">

        <input id="regName"
            required
            placeholder="Full Name"
            class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700">

        <input id="regEmail"
            type="email"
            required
            placeholder="Email address"
            class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700">

        <input id="regDob"
            type="date"
            required
            class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700">

        <input id="regPassword"
            type="password"
            minlength="6"
            required
            placeholder="Password"
            class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700">

        <button class="w-full p-3.5 rounded-xl bg-blue-600 font-bold">
            Create Account
        </button>

    </form>

</section>


<!-- WORKER DASHBOARD -->

<section id="workerPage" class="hidden">

    <header class="p-5 border-b border-slate-800 flex justify-between items-center">

        <div>
            <h2 id="workerName" class="font-bold text-lg">Worker</h2>
            <p id="workerId" class="text-xs text-blue-400 font-mono">
                AP000000
            </p>
        </div>

        <button onclick="logout()"
            class="text-red-400 font-bold">
            Logout
        </button>

    </header>


    <div class="p-5 space-y-5">

        <div class="rounded-2xl p-6 bg-blue-600">
            <p class="text-sm text-blue-100">
                Available Balance
            </p>

            <h1 id="workerBalance"
                class="text-4xl font-bold mt-2">
                ₹0.00
            </h1>

            <p class="text-xs mt-4 text-blue-100">
                Minimum withdrawal: ₹10
            </p>
        </div>


        <!-- WITHDRAW -->

        <div class="bg-slate-800 rounded-2xl p-5">

            <h2 class="font-bold text-lg mb-4">
                Withdraw Funds
            </h2>

            <form onsubmit="createWithdrawal(event)"
                class="space-y-4">

                <input id="withdrawAmount"
                    type="number"
                    min="10"
                    required
                    placeholder="Amount"
                    class="w-full p-3.5 rounded-xl bg-slate-900 border border-slate-700">

                <select id="paymentMethod"
                    onchange="changePaymentMethod()"
                    class="w-full p-3.5 rounded-xl bg-slate-900 border border-slate-700">

                    <option value="upi">UPI</option>
                    <option value="gift_card">Gift Card</option>

                </select>


                <div id="upiSection">

                    <input id="upiId"
                        placeholder="UPI ID e.g. name@upi"
                        class="w-full p-3.5 rounded-xl bg-slate-900 border border-slate-700">

                </div>


                <div id="giftCardSection" class="hidden">

                    <select id="giftCardType"
                        class="w-full p-3.5 rounded-xl bg-slate-900 border border-slate-700">

                        <option value="amazon">Amazon</option>
                        <option value="flipkart">Flipkart</option>
                        <option value="google_play">Google Play</option>

                    </select>

                </div>


                <button class="w-full p-3.5 rounded-xl bg-blue-600 font-bold">
                    Request Withdrawal
                </button>

            </form>

        </div>


        <!-- TRANSACTIONS -->

        <div>
            <h2 class="font-bold text-lg mb-3">
                Transaction History
            </h2>

            <div id="transactions" class="space-y-2"></div>
        </div>

    </div>

</section>


<!-- ADMIN DASHBOARD -->

<section id="adminPage" class="hidden">

    <header class="p-5 border-b border-slate-800 flex justify-between items-center">

        <div>
            <p class="text-xs text-blue-400">CONTROL PANEL</p>
            <h2 class="font-bold text-lg">Admin Dashboard</h2>
        </div>

        <button onclick="logout()"
            class="text-red-400 font-bold">
            Logout
        </button>

    </header>


    <div class="p-5 space-y-5">

        <div class="grid grid-cols-2 gap-3">

            <div class="bg-slate-800 rounded-xl p-4">
                <p class="text-xs text-slate-400">Total Workers</p>
                <h2 id="totalWorkers" class="text-2xl font-bold">0</h2>
            </div>

            <div class="bg-slate-800 rounded-xl p-4">
                <p class="text-xs text-slate-400">Pending Withdrawals</p>
                <h2 id="pendingWithdrawals" class="text-2xl font-bold text-yellow-400">0</h2>
            </div>

        </div>


        <div class="flex gap-5 border-b border-slate-800">

            <button id="withdrawTab"
                onclick="adminTab('withdrawals')"
                class="pb-3 text-blue-400 font-bold border-b-2 border-blue-500">
                Withdrawals
            </button>

            <button id="workerTab"
                onclick="adminTab('workers')"
                class="pb-3 text-slate-400 font-bold">
                Workers
            </button>

        </div>


        <div id="withdrawalsView">
            <div id="withdrawalList" class="space-y-3"></div>
        </div>


        <div id="workersView" class="hidden">

            <input id="workerSearch"
                oninput="renderWorkers()"
                placeholder="Search Worker ID or Name"
                class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mb-3">

            <div id="workerList" class="space-y-3"></div>

        </div>

    </div>

</section>

</main>
<script>

const SUPABASE_URL = "https://ykswgkrmqsmdneobykri.supabase.co";
const SUPABASE_KEY = "sb_publishable_iED-0Op0GP8e1msvL7ksdw_53rXjJ_H";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let workers = [];
let withdrawals = [];
let selectedWorker = null;
let selectedWithdrawal = null;


const $ = id => document.getElementById(id);


function money(amount) {
    return "₹" + Number(amount || 0).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function toast(message, type = "info") {

    const box = document.createElement("div");

    box.className =
        "m-2 px-4 py-3 rounded-xl text-sm font-bold " +
        (type === "error"
            ? "bg-red-600"
            : type === "success"
            ? "bg-emerald-600"
            : "bg-blue-600");

    box.textContent = message;

    $("toast").appendChild(box);

    setTimeout(() => box.remove(), 3500);
}


function showPage(page) {

    $("auth").classList.add("hidden");
    $("workerPage").classList.add("hidden");
    $("adminPage").classList.add("hidden");

    $(page).classList.remove("hidden");
}


function showTab(type) {

    $("loginForm").classList.toggle(
        "hidden",
        type !== "login"
    );

    $("registerForm").classList.toggle(
        "hidden",
        type !== "register"
    );

    $("loginTab").className =
        type === "login"
        ? "flex-1 py-3 rounded-lg bg-blue-600 font-bold"
        : "flex-1 py-3 rounded-lg text-slate-400";

    $("registerTab").className =
        type === "register"
        ? "flex-1 py-3 rounded-lg bg-blue-600 font-bold"
        : "flex-1 py-3 rounded-lg text-slate-400";
}


async function login(event) {

    event.preventDefault();

    try {

        const { data, error } =
            await db.auth.signInWithPassword({
                email: $("loginEmail").value.trim(),
                password: $("loginPassword").value
            });

        if (error) throw error;

        await openApp(data.user);

    } catch (error) {

        console.error(error);
        toast(error.message, "error");

    }
}


async function register(event) {

    event.preventDefault();

    try {

        const { data, error } =
            await db.auth.signUp({
                email: $("regEmail").value.trim(),
                password: $("regPassword").value,
                options: {
                    data: {
                        full_name: $("regName").value.trim(),
                        date_of_birth: $("regDob").value
                    }
                }
            });

        if (error) throw error;

        if (data.session) {

            await openApp(data.user);

        } else {

            toast(
                "Account created. Check your email if confirmation is enabled.",
                "success"
            );

            showTab("login");

        }

    } catch (error) {

        console.error(error);
        toast(error.message, "error");

    }
}


async function openApp(user) {

    currentUser = user;

    const { data, error } =
        await db
            .from("profiles")
            .select(`
                id,
                full_name,
                date_of_birth,
                role,
                is_active,
                worker_id
            `)
            .eq("id", user.id)
            .single();

    if (error) throw error;

    if (data.is_active === false) {
        throw new Error("Your account is inactive.");
    }

    currentProfile = data;

    if (data.role === "admin") {

        showPage("adminPage");
        await loadAdmin();

    } else {

        showPage("workerPage");
        await loadWorker();

    }
}


async function restoreSession() {

    try {

        const { data, error } =
            await db.auth.getSession();

        if (error) throw error;

        if (data.session) {

            await openApp(data.session.user);

        } else {

            showPage("auth");

        }

    } catch (error) {

        console.error(error);
        showPage("auth");

    }
}


async function logout() {

    await db.auth.signOut();

    currentUser = null;
    currentProfile = null;

    showPage("auth");

    $("loginPassword").value = "";

    toast("Logged out successfully", "success");
}


async function loadWorker() {

    $("workerName").textContent =
        currentProfile.full_name || "Worker";

    $("workerId").textContent =
        currentProfile.worker_id || "AP000000";


    const { data: wallet, error } =
        await db
            .from("wallets")
            .select("balance")
            .eq("user_id", currentUser.id)
            .single();

    if (error) {

        console.error(error);

        $("workerBalance").textContent = "₹0.00";

    } else {

        $("workerBalance").textContent =
            money(wallet.balance);

    }


    const { data: transactions, error: txError } =
        await db
            .from("transactions")
            .select(`
                id,
                type,
                amount,
                description,
                balance_after,
                created_at
            `)
            .eq("user_id", currentUser.id)
            .order("created_at", {
                ascending: false
            })
            .limit(50);


    if (txError) {

        console.error(txError);

        $("transactions").innerHTML =
            '<p class="text-sm text-slate-500">Unable to load transactions.</p>';

        return;

    }


    if (!transactions || transactions.length === 0) {

        $("transactions").innerHTML =
            '<p class="text-sm text-slate-500">No transactions yet.</p>';

        return;

    }


    $("transactions").innerHTML =
        transactions.map(tx => {

            const credit = tx.type === "credit";

            return `
                <div class="p-3 rounded-xl bg-slate-800 border border-slate-700 flex justify-between">
                    <div>
                        <p class="text-sm font-bold">
                            ${tx.description || tx.type}
                        </p>

                        <p class="text-[10px] text-slate-500">
                            ${new Date(tx.created_at).toLocaleString("en-IN")}
                        </p>
                    </div>

                    <p class="${credit ? "text-emerald-400" : "text-red-400"} font-bold">
                        ${credit ? "+" : "-"}${money(tx.amount)}
                    </p>
                </div>
            `;

        }).join("");

}


function changePaymentMethod() {

    const isUpi =
        $("paymentMethod").value === "upi";

    $("upiSection").classList.toggle(
        "hidden",
        !isUpi
    );

    $("giftCardSection").classList.toggle(
        "hidden",
        isUpi
    );
}


async function createWithdrawal(event) {

    event.preventDefault();

    const amount =
        Number($("withdrawAmount").value);

    const method =
        $("paymentMethod").value;

    const upi =
        $("upiId").value.trim();

    const gift =
        $("giftCardType").value;


    if (amount < 10) {

        toast(
            "Minimum withdrawal amount is ₹10",
            "error"
        );

        return;
    }


    if (
        method === "upi" &&
        !/^[^\s@]+@[^\s@]+$/.test(upi)
    ) {

        toast(
            "Please enter a valid UPI ID",
            "error"
        );

        return;
    }


    try {

        const { error } =
            await db.rpc(
                "create_withdrawal",
                {
                    p_amount: amount,
                    p_payment_method: method,
                    p_gift_card_type:
                        method === "gift_card"
                            ? gift
                            : null,
                    p_upi_id:
                        method === "upi"
                            ? upi
                            : null
                }
            );

        if (error) throw error;


        $("withdrawAmount").value = "";
        $("upiId").value = "";

        toast(
            "Withdrawal request submitted successfully.",
            "success"
        );

        await loadWorker();

    } catch (error) {

        console.error(error);
        toast(error.message, "error");

    }
}


async function loadAdmin() {

    await loadWorkers();
    await loadWithdrawals();

}


async function loadWorkers() {

    const { data, error } =
        await db
            .from("profiles")
            .select(`
                id,
                full_name,
                email,
                worker_id,
                is_active
            `)
            .eq("role", "worker")
            .order("full_name");


    if (error) {

        console.error(error);
        toast("Unable to load workers.", "error");

        return;
    }


    const ids =
        (data || []).map(worker => worker.id);

    let walletData = [];


    if (ids.length) {

        const result =
            await db
                .from("wallets")
                .select("user_id,balance")
                .in("user_id", ids);

        walletData =
            result.data || [];

    }


    const balanceMap =
        Object.fromEntries(
            walletData.map(wallet => [
                wallet.user_id,
                wallet.balance
            ])
        );


    workers =
        (data || []).map(worker => ({
            ...worker,
            balance:
                balanceMap[worker.id] || 0
        }));


    $("totalWorkers").textContent =
        workers.length;

    renderWorkers();

}


function renderWorkers() {

    const search =
        ($("workerSearch").value || "")
            .toLowerCase()
            .trim();


    const list =
        workers.filter(worker =>
            (worker.worker_id || "")
                .toLowerCase()
                .includes(search)
            ||
            (worker.full_name || "")
                .toLowerCase()
                .includes(search)
        );


    if (!list.length) {

        $("workerList").innerHTML =
            '<p class="text-sm text-slate-500 text-center p-5">No workers found.</p>';

        return;
    }


    $("workerList").innerHTML =
        list.map(worker => `

            <div class="p-4 rounded-xl bg-slate-800 border border-slate-700">

                <div class="flex justify-between gap-3">

                    <div>

                        <p class="font-bold">
                            ${worker.full_name || "Worker"}
                        </p>

                        <p class="text-xs text-blue-400 font-mono">
                            ${worker.worker_id || ""}
                        </p>

                        <p class="text-xs text-slate-500">
                            ${worker.email || ""}
                        </p>

                    </div>

                    <div class="text-right">

                        <p class="font-bold text-emerald-400">
                            ${money(worker.balance)}
                        </p>

                        <button
                            onclick="openAddMoney('${worker.id}')"
                            class="mt-2 px-3 py-2 rounded-lg bg-blue-600 text-xs font-bold">
                            + Add Money
                        </button>

                    </div>

                </div>

            </div>

        `).join("");

}


async function loadWithdrawals() {

    const { data, error } =
        await db
            .from("withdrawals")
            .select(`
                id,
                user_id,
                amount,
                status,
                payment_method,
                gift_card_type,
                upi_id,
                payment_reference,
                admin_note,
                created_at,
                profiles(
                    full_name,
                    worker_id,
                    email
                )
            `)
            .eq("status", "pending")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);
        toast("Unable to load withdrawals.", "error");

        return;
    }


    withdrawals = data || [];

    $("pendingWithdrawals").textContent =
        withdrawals.length;


    if (!withdrawals.length) {

        $("withdrawalList").innerHTML =
            '<p class="text-sm text-slate-500 text-center p-5">No pending withdrawals.</p>';

        return;
    }


    $("withdrawalList").innerHTML =
        withdrawals.map(item => `

            <div class="p-4 rounded-xl bg-slate-800 border border-slate-700">

                <div class="flex justify-between">

                    <div>

                        <p class="font-bold">
                            ${item.profiles?.full_name || "Worker"}
                        </p>

                        <p class="text-xs text-blue-400 font-mono">
                            ${item.profiles?.worker_id || ""}
                        </p>

                    </div>

                    <p class="font-bold text-yellow-400">
                        ${money(item.amount)}
                    </p>

                </div>

                <div class="mt-3 text-xs text-slate-400 space-y-1">

                    <p>
                        Method:
                        <b class="text-white">
                            ${item.payment_method === "upi"
                                ? "UPI"
                                : "Gift Card"}
                        </b>
                    </p>

                    ${
                        item.payment_method === "upi"
                        ? `
                            <p>
                                UPI ID:
                                <b class="text-white">
                                    ${item.upi_id || ""}
                                </b>
                            </p>
                        `
                        : `
                            <p>
                                Gift Card:
                                <b class="text-white">
                                    ${item.gift_card_type || ""}
                                </b>
                            </p>
                        `
                    }

                    <p>
                        ${new Date(item.created_at).toLocaleString("en-IN")}
                    </p>

                </div>

                <button
                    onclick="openApprove('${item.id}')"
                    class="w-full mt-4 p-3 rounded-xl bg-emerald-600 font-bold">
                    Approve / Mark Paid
                </button>

            </div>

        `).join("");

}


function adminTab(type) {

    const withdrawals =
        type === "withdrawals";


    $("withdrawalsView").classList.toggle(
        "hidden",
        !withdrawals
    );

    $("workersView").classList.toggle(
        "hidden",
        withdrawals
    );


    $("withdrawTab").className =
        withdrawals
        ? "pb-3 text-blue-400 font-bold border-b-2 border-blue-500"
        : "pb-3 text-slate-400 font-bold";


    $("workerTab").className =
        !withdrawals
        ? "pb-3 text-blue-400 font-bold border-b-2 border-blue-500"
        : "pb-3 text-slate-400";
}
  function openAddMoney(workerId) {

    selectedWorker =
        workers.find(worker => worker.id === workerId);

    if (!selectedWorker) return;

    const amount = prompt(
        `Add money to ${selectedWorker.full_name} (${selectedWorker.worker_id})\n\nEnter amount:`
    );

    if (amount === null) return;

    const value = Number(amount);

    if (!value || value < 1) {

        toast(
            "Minimum add-money amount is ₹1.",
            "error"
        );

        return;
    }

    addMoneyToWorker(value);
}


async function addMoneyToWorker(amount) {

    if (!selectedWorker) return;

    const description =
        prompt(
            "Enter transaction description:",
            "Admin credit"
        ) || "Admin credit";


    try {

        const { error } =
            await db.rpc(
                "admin_add_money",
                {
                    p_user_id: selectedWorker.id,
                    p_amount: amount,
                    p_description: description
                }
            );


        if (error) throw error;


        toast(
            `${money(amount)} added successfully.`,
            "success"
        );


        selectedWorker = null;

        await loadAdmin();

    } catch (error) {

        console.error(error);

        toast(
            error.message,
            "error"
        );

    }
}


function openApprove(withdrawalId) {

    selectedWithdrawal =
        withdrawals.find(
            item => String(item.id) === String(withdrawalId)
        );


    if (!selectedWithdrawal) return;


    const item = selectedWithdrawal;


    let details =
        `Worker: ${item.profiles?.full_name || "Worker"}\n` +
        `Worker ID: ${item.profiles?.worker_id || ""}\n` +
        `Amount: ${money(item.amount)}\n`;


    if (item.payment_method === "upi") {

        details +=
            `UPI ID: ${item.upi_id || ""}\n`;

    } else {

        details +=
            `Gift Card: ${item.gift_card_type || ""}\n`;

    }


    const reference =
        prompt(
            details +
            "\nEnter UTR / Gift Card Code:"
        );


    if (reference === null) return;


    if (!reference.trim()) {

        toast(
            "Payment reference is required.",
            "error"
        );

        return;
    }


    const note =
        prompt(
            "Admin note (optional):",
            ""
        );


    approveWithdrawal(
        reference.trim(),
        note ? note.trim() : null
    );
}


async function approveWithdrawal(reference, note) {

    if (!selectedWithdrawal) return;


    try {

        const { error } =
            await db.rpc(
                "admin_approve_withdrawal",
                {
                    p_withdrawal_id:
                        Number(selectedWithdrawal.id),

                    p_payment_reference:
                        reference,

                    p_admin_note:
                        note
                }
            );


        if (error) throw error;


        toast(
            "Withdrawal approved successfully.",
            "success"
        );


        selectedWithdrawal = null;

        await loadAdmin();

    } catch (error) {

        console.error(error);

        toast(
            error.message,
            "error"
        );

    }
}


db.auth.onAuthStateChange(
    async (event, session) => {

        if (event === "SIGNED_OUT") {

            currentUser = null;
            currentProfile = null;

            showPage("auth");

        }

    }
);


restoreSession();

</script>
