<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Agency Worker Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f6f9;
  color:#111827;
  font-family:Arial,sans-serif;
}
.hidden{display:none!important}
.container{
  max-width:430px;
  margin:auto;
  padding:20px;
}
.logo{
  text-align:center;
  font-size:30px;
  font-weight:800;
  margin:35px 0 5px;
}
.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}
h2{margin:0 0 18px}
label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin:12px 0 6px;
}
input,select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:15px;
  background:#fff;
}
button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  font-size:15px;
  font-weight:700;
  margin-top:12px;
  cursor:pointer;
}
.primary{background:#2563eb;color:white}
.secondary{background:#eef2ff;color:#1d4ed8}
.danger{background:#fee2e2;color:#b91c1c}
.link{background:none;color:#2563eb}
.error{color:#dc2626;font-size:14px;margin-top:10px}
.success{color:#16a34a;font-size:14px;margin-top:10px}
.muted{color:#6b7280;font-size:13px}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.title{
  font-size:22px;
  font-weight:800;
}
.logout{
  width:auto;
  margin:0;
  padding:8px 12px;
  background:#fee2e2;
  color:#b91c1c;
  font-size:12px;
}
.balance{
  background:#2563eb;
  color:white;
  border-radius:20px;
  padding:24px;
  margin-bottom:18px;
}
.balance-amount{
  font-size:36px;
  font-weight:800;
  margin-top:7px;
}
.worker-id{
  margin-top:9px;
  font-size:14px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.grid button{
  margin:0;
  min-height:82px;
  background:white;
  border:1px solid #e5e7eb;
  color:#111827;
}
.transaction{
  padding:13px 0;
  border-bottom:1px solid #eee;
}
.transaction:last-child{border-bottom:0}
.transaction-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.credit{color:#16a34a;font-weight:700}
.debit{color:#dc2626;font-weight:700}
.profile-photo{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 10px;
}
.note{
  background:#fff7ed;
  color:#9a3412;
  padding:10px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->
<div id="authBox" class="container">
  <div class="logo">AP Agency</div>
  <div class="subtitle">Worker Wallet</div>

  <div id="loginCard" class="card">
    <h2>Worker Login</h2>
    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="Enter email">
    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Enter password">
    <button id="loginBtn" class="primary">Login</button>
    <div id="loginMessage"></div>
    <button id="showSignupBtn" class="link">Create New Account</button>
  </div>

  <div id="signupCard" class="card hidden">
    <h2>Create Account</h2>
    <label>Full Name</label>
    <input id="signupName" type="text" placeholder="Enter full name">
    <label>Email</label>
    <input id="signupEmail" type="email" placeholder="Enter email">
    <label>Date of Birth</label>
    <input id="signupDob" type="date">
    <label>Password</label>
    <input id="signupPassword" type="password" placeholder="Create password">
    <button id="signupBtn" class="primary">Create Account</button>
    <div id="signupMessage"></div>
    <button id="showLoginBtn" class="link">Back to Login</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="container hidden">

  <div class="topbar">
    <div class="title">AP Agency</div>
    <button id="logoutBtn" class="logout">Logout</button>
  </div>

  <!-- HOME -->
  <section id="homePage">
    <div class="balance">
      <div>Available Balance</div>
      <div id="balance" class="balance-amount">₹0.00</div>
      <div id="workerId" class="worker-id">Worker ID: -</div>
    </div>

    <div class="grid">
      <button data-page="withdrawPage">💸<br>Withdraw Fund</button>
      <button data-page="transactionsPage">📋<br>Transaction History</button>
      <button data-page="profilePage">👤<br>Profile</button>
      <button data-page="settingsPage">⚙️<br>Settings</button>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>Welcome 👋</h3>
      <div id="welcomeText">Welcome to AP Agency.</div>
    </div>
  </section>

  <!-- WITHDRAW -->
  <section id="withdrawPage" class="hidden">
    <div class="card">
      <h2>Withdraw Fund</h2>
      <div class="note">Minimum withdrawal amount: ₹10</div>

      <label>Amount</label>
      <input id="withdrawAmount" type="number" min="10" placeholder="Enter amount">

      <label>Payment Method</label>
      <select id="paymentMethod">
        <option value="">Select payment method</option>
        <option value="upi">UPI</option>
        <option value="gift_card">Gift Card</option>
      </select>

      <div id="upiBox" class="hidden">
        <label>UPI ID</label>
        <input id="upiId" type="text" placeholder="example@upi">
      </div>

      <div id="giftCardBox" class="hidden">
        <label>Gift Card</label>
        <select id="giftCardType">
          <option value="">Select gift card</option>
          <option value="amazon">Amazon</option>
          <option value="flipkart">Flipkart</option>
          <option value="google_play">Google Play</option>
        </select>
      </div>

      <button id="withdrawBtn" class="primary">Submit Withdrawal</button>
      <div id="withdrawMessage"></div>
      <button class="secondary" data-page="homePage">Back</button>
    </div>
  </section>

  <!-- TRANSACTIONS -->
  <section id="transactionsPage" class="hidden">
    <div class="card">
      <h2>Transaction History</h2>
      <div id="transactions">
        <div class="muted">Loading...</div>
      </div>
      <button class="secondary" data-page="homePage">Back</button>
    </div>
  </section>

  <!-- PROFILE -->
  <section id="profilePage" class="hidden">
    <div class="card">
      <h2>My Profile</h2>
      <img id="profilePhoto" class="profile-photo" src="https://via.placeholder.com/90" alt="Profile">

      <input type="file" id="profilePhotoInput" accept="image/png, image/jpeg, image/jpg" class="hidden">
      <button id="changePhotoBtn" class="secondary" style="margin-top:0; margin-bottom:15px; font-size:13px; padding:8px;">
        Change Profile Photo
      </button>

      <label>Worker ID</label>
      <input id="profileWorkerId" readonly>

      <label>Full Name</label>
      <input id="profileName">

      <label>Email</label>
      <input id="profileEmail" readonly>

      <label>Date of Birth</label>
      <input id="profileDob" type="date">

      <button id="saveProfileBtn" class="primary">Save Profile</button>
      <div id="profileMessage"></div>

      <button class="secondary" data-page="homePage">Back</button>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="settingsPage" class="hidden">
    <div class="card">
      <h2>Settings</h2>
      <div class="muted">AP Agency Worker Wallet</div>
      <button id="settingsLogoutBtn" class="danger">Logout</button>
      <button class="secondary" data-page="homePage">Back</button>
    </div>
  </section>

</div>

<script>
const SUPABASE_URL = "https://ykswgkrmqsmdneobykri.supabase.co";
const SUPABASE_KEY = "sb_publishable_iED-0Op0GP8e1msvL7ksdw_53rXjJ_H";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let currentWallet = null;

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showMessage(id,text,type){
  $(id).innerHTML = text
    ? '<div class="'+type+'">'+escapeHtml(text)+'</div>'
    : "";
}

function showPage(pageId){
  const pages = ["homePage", "withdrawPage", "transactionsPage", "profilePage", "settingsPage"];
  pages.forEach(id => $(id).classList.add("hidden"));
  $(pageId).classList.remove("hidden");

  if(pageId === "transactionsPage") loadTransactions();
  if(pageId === "profilePage") loadProfile();
}

function showSignup(){
  $("loginCard").classList.add("hidden");
  $("signupCard").classList.remove("hidden");
}

function showLogin(){
  $("signupCard").classList.add("hidden");
  $("loginCard").classList.remove("hidden");
}

async function login(){
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if(!email || !password){
    showMessage("loginMessage", "Enter email and password.", "error");
    return;
  }

  showMessage("loginMessage", "Logging in...", "muted");

  const result = await supabaseClient.auth.signInWithPassword({ email, password });

  if(result.error){
    showMessage("loginMessage", result.error.message, "error");
    return;
  }

  currentUser = result.data.user;
  await openApp();
}

async function signup(){
  const name = $("signupName").value.trim();
  const email = $("signupEmail").value.trim();
  const dob = $("signupDob").value;
  const password = $("signupPassword").value;

  if(!name || !email || !dob || !password){
    showMessage("signupMessage", "Please fill all fields.", "error");
    return;
  }

  if(password.length < 6){
    showMessage("signupMessage", "Password must be at least 6 characters.", "error");
    return;
  }

  showMessage("signupMessage", "Creating account...", "muted");

  const result = await supabaseClient.auth.signUp({
    email,
    password,
    options: { data: { full_name: name, date_of_birth: dob } }
  });

  if(result.error){
    showMessage("signupMessage", result.error.message, "error");
    return;
  }

  if(result.data.session){
    currentUser = result.data.user;
    await openApp();
  } else {
    showMessage("signupMessage", "Account created! Please check email or login.", "success");
  }
}

async function openApp(){
  if(!currentUser) return;

  try {
    await loadProfile();
    await loadWallet();

    $("authBox").classList.add("hidden");
    $("app").classList.remove("hidden");
    showPage("homePage");
  } catch(error) {
    console.error(error);
    $("authBox").classList.remove("hidden");
    $("app").classList.add("hidden");
    showMessage("loginMessage", "Could not load account: " + error.message, "error");
  }
}

async function loadProfile(){
  if(!currentUser) return;
  const result = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if(result.error) throw result.error;

  currentProfile = result.data;
  if(!currentProfile) return;

  $("workerId").textContent = "Worker ID: " + (currentProfile.worker_id || "-");
  $("welcomeText").textContent = "Welcome, " + (currentProfile.full_name || "Worker") + "!";
  $("profileWorkerId").value = currentProfile.worker_id || "";
  $("profileName").value = currentProfile.full_name || "";
  $("profileEmail").value = currentUser.email || "";
  $("profileDob").value = currentProfile.date_of_birth || "";

  if(currentProfile.avatar_url){
    $("profilePhoto").src = currentProfile.avatar_url;
  }
}

async function saveProfile(){
  const name = $("profileName").value.trim();
  const dob = $("profileDob").value;

  showMessage("profileMessage", "Saving...", "muted");

  const result = await supabaseClient
    .from("profiles")
    .update({ full_name: name, date_of_birth: dob })
    .eq("id", currentUser.id);

  if(result.error){
    showMessage("profileMessage", result.error.message, "error");
  } else {
    showMessage("profileMessage", "Profile updated successfully!", "success");
    await loadProfile();
  }
}

async function uploadProfilePhoto(file){
  if(!file || !currentUser) return;

  showMessage("profileMessage", "Uploading photo...", "muted");

  const fileExt = file.name.split('.').pop();
  const filePath = `${currentUser.id}/${Date.now()}.${fileExt}`;

  const { data: uploadData, error: uploadError } = await supabaseClient
    .storage
    .from("avatars")
    .upload(filePath, file, { upsert: true });

  if(uploadError){
    showMessage("profileMessage", "Upload error: " + uploadError.message, "error");
    return;
  }

  const { data: publicUrlData } = supabaseClient
    .storage
    .from("avatars")
    .getPublicUrl(filePath);

  const publicUrl = publicUrlData.publicUrl;

  const { error: updateError } = await supabaseClient
    .from("profiles")
    .update({ avatar_url: publicUrl })
    .eq("id", currentUser.id);

  if(updateError){
    showMessage("profileMessage", "Error saving photo URL: " + updateError.message, "error");
  } else {
    $("profilePhoto").src = publicUrl;
    showMessage("profileMessage", "Profile photo updated!", "success");
  }
}

async function loadWallet(){
  if(!currentUser) return;
  const result = await supabaseClient
    .from("wallets")
    .select("*")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  if(result.error) throw result.error;

  currentWallet = result.data;
  const balance = currentWallet ? (currentWallet.balance || 0) : 0;
  $("balance").textContent = "₹" + balance.toFixed(2);
}

async function loadTransactions(){
  if(!currentUser) return;
  $("transactions").innerHTML = '<div class="muted">Loading...</div>';

  const result = await supabaseClient
    .from("transactions")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: false });

  if(result.error){
    $("transactions").innerHTML = '<div class="error">'+escapeHtml(result.error.message)+'</div>';
    return;
  }

  if(!result.data || result.data.length === 0){
    $("transactions").innerHTML = '<div class="muted">No transactions found.</div>';
    return;
  }

  let html = "";
  result.data.forEach(tx => {
    const isCredit = tx.type === "credit";
    html += `
      <div class="transaction">
        <div class="transaction-row">
          <div><strong>${escapeHtml(tx.description || 'Transaction')}</strong></div>
          <div class="${isCredit ? 'credit' : 'debit'}">
            ${isCredit ? '+' : '-'}₹${parseFloat(tx.amount).toFixed(2)}
          </div>
        </div>
        <div class="muted">${new Date(tx.created_at).toLocaleString()}</div>
      </div>
    `;
  });
  $("transactions").innerHTML = html;
}

async function withdraw(){
  const amount = parseFloat($("withdrawAmount").value);
  const method = $("paymentMethod").value;

  if(!amount || amount < 10){
    showMessage("withdrawMessage", "Minimum withdrawal is ₹10.", "error");
    return;
  }

  if(!method){
    showMessage("withdrawMessage", "Select payment method.", "error");
    return;
  }

  showMessage("withdrawMessage", "Processing request...", "muted");

  const result = await supabaseClient
    .from("withdrawals")
    .insert([{
      user_id: currentUser.id,
      amount: amount,
      method: method,
      details: method === "upi" ? $("upiId").value : $("giftCardType").value
    }]);

  if(result.error){
    showMessage("withdrawMessage", result.error.message, "error");
  } else {
    showMessage("withdrawMessage", "Withdrawal request submitted!", "success");
    $("withdrawAmount").value = "";
    await loadWallet();
  }
}

async function logout(){
  await supabaseClient.auth.signOut();
  currentUser = null;
  currentProfile = null;
  currentWallet = null;

  $("app").classList.add("hidden");
  $("authBox").classList.remove("hidden");
  showLogin();
}

document.addEventListener("DOMContentLoaded", () => {
  $("loginBtn").onclick = login;
  $("signupBtn").onclick = signup;
  $("showSignupBtn").onclick = showSignup;
  $("showLoginBtn").onclick = showLogin;
  $("logoutBtn").onclick = logout;
  $("settingsLogoutBtn").onclick = logout;
  $("saveProfileBtn").onclick = saveProfile;
  $("withdrawBtn").onclick = withdraw;

  $("changePhotoBtn").onclick = () => $("profilePhotoInput").click();
  $("profilePhotoInput").onchange = (e) => {
    if(e.target.files && e.target.files[0]){
      uploadProfilePhoto(e.target.files[0]);
    }
  };

  $("paymentMethod").onchange = (e) => {
    const val = e.target.value;
    $("upiBox").classList.toggle("hidden", val !== "upi");
    $("giftCardBox").classList.toggle("hidden", val !== "gift_card");
  };

  document.querySelectorAll("[data-page]").forEach(btn => {
    btn.onclick = () => showPage(btn.getAttribute("data-page"));
  });

  supabaseClient.auth.getSession().then(({ data }) => {
    if (data && data.session) {
      currentUser = data.session.user;
      openApp();
    }
  });
});
</script>
</body>
</html>
