<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AP Agency Worker Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#111827;
}
.container{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  padding:20px;
}
.hidden{display:none!important}
.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}
.logo{
  text-align:center;
  padding:25px 0;
}
.logo h1{margin:0;font-size:28px}
.logo p{color:#6b7280}
h2{margin-top:0}
label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
  font-size:14px;
}
input,select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:15px;
}
button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:#fff;
  font-weight:bold;
  font-size:15px;
  margin-top:12px;
}
button.secondary{
  background:#e5e7eb;
  color:#111827;
}
button.danger{background:#dc2626}
button.green{background:#15803d}
button.link{
  background:transparent;
  color:#2563eb;
}
.message{margin-top:12px;font-size:14px}
.error{color:#dc2626}
.success{color:#15803d}
.small{font-size:13px;color:#6b7280}
.balance-card{
  background:#111827;
  color:white;
  padding:24px;
  border-radius:18px;
  margin-bottom:15px;
}
.balance{
  font-size:34px;
  font-weight:bold;
  margin:8px 0;
}
.worker-id{font-size:13px;opacity:.8}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.menu{
  background:#fff;
  color:#111827;
  min-height:100px;
  border:1px solid #e5e7eb;
  margin:0;
}
.menu span{
  display:block;
  font-size:27px;
  margin-bottom:8px;
}
.top{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}
.top button{
  width:auto;
  margin:0;
  padding:9px 14px;
}
.top h2{margin:0;font-size:20px}
.row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
}
.transaction{
  padding:14px 0;
  border-bottom:1px solid #eee;
}
.credit{color:#15803d;font-weight:bold}
.debit{color:#dc2626;font-weight:bold}
.empty{
  text-align:center;
  padding:25px;
  color:#6b7280;
}
.radio{
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin-top:8px;
}
.radio input{width:auto}
</style>
</head>

<body>

<div class="container">

<!-- AUTH -->

<div id="authBox">

<div class="logo">
<h1>AP Agency</h1>
<p>Worker Wallet</p>
</div>

<div id="loginBox" class="card">

<h2>Worker Login</h2>

<label>Email</label>
<input id="loginEmail" type="email" placeholder="Enter email">

<label>Password</label>
<input id="loginPassword" type="password" placeholder="Enter password">

<button onclick="login()">Login</button>

<button class="link" onclick="showSignup()">
Create New Account
</button>

<div id="loginMessage" class="message"></div>

</div>


<div id="signupBox" class="card hidden">

<h2>Create Account</h2>

<label>Full Name</label>
<input id="signupName" type="text">

<label>Email</label>
<input id="signupEmail" type="email">

<label>Date of Birth</label>
<input id="signupDob" type="date">

<label>Password</label>
<input id="signupPassword" type="password">

<button onclick="signup()">Create Account</button>

<button class="secondary" onclick="showLogin()">
Back to Login
</button>

<div id="signupMessage" class="message"></div>

</div>

</div>


<!-- APP -->

<div id="app" class="hidden">


<!-- HOME -->

<div id="homePage">

<div class="logo">
<h1>AP Agency</h1>
<p>Worker Dashboard</p>
</div>

<div class="balance-card">

<div class="small" style="color:white">
Available Balance
</div>

<div class="balance">
₹<span id="balance">0.00</span>
</div>

<div class="worker-id">
Worker ID:
<span id="workerId">---</span>
</div>

</div>


<div class="grid">

<button class="menu" onclick="showPage('withdrawPage')">
<span>💸</span>
Withdraw
</button>

<button class="menu" onclick="showPage('transactionsPage');loadTransactions()">
<span>📋</span>
Transactions
</button>

<button class="menu" onclick="showPage('profilePage');loadProfile()">
<span>👤</span>
Profile
</button>

<button class="menu" onclick="showPage('settingsPage')">
<span>⚙️</span>
Settings
</button>

</div>

</div>


<!-- WITHDRAW -->

<div id="withdrawPage" class="hidden">

<div class="top">
<button class="secondary" onclick="showPage('homePage')">
← Back
</button>
<h2>Withdraw</h2>
</div>

<div class="card">

<div class="row">
<span>Balance</span>
<strong>₹<span id="withdrawBalance">0.00</span></strong>
</div>

<label>Amount</label>
<input id="withdrawAmount" type="number" min="10" placeholder="Minimum ₹10">

<label>Payment Method</label>

<div class="radio">
<label style="margin:0;font-weight:normal">
<input type="radio" name="method" value="upi"
checked onchange="changePayment()">
UPI
</label>
</div>

<div class="radio">
<label style="margin:0;font-weight:normal">
<input type="radio" name="method" value="gift_card"
onchange="changePayment()">
Gift Card
</label>
</div>


<div id="upiBox">

<label>UPI ID</label>
<input id="upiId" placeholder="example@upi">

</div>


<div id="giftBox" class="hidden">

<label>Gift Card</label>

<select id="giftType">
<option value="">Select Gift Card</option>
<option value="amazon">Amazon</option>
<option value="flipkart">Flipkart</option>
<option value="google_play">Google Play</option>
</select>

</div>


<button class="green" onclick="withdraw()">
Submit Withdrawal
</button>

<div id="withdrawMessage" class="message"></div>

</div>

</div>


<!-- TRANSACTIONS -->

<div id="transactionsPage" class="hidden">

<div class="top">
<button class="secondary" onclick="showPage('homePage')">
← Back
</button>
<h2>Transactions</h2>
</div>

<div class="card">
<div id="transactionList">
<div class="empty">Loading...</div>
</div>
</div>

</div>


<!-- PROFILE -->

<div id="profilePage" class="hidden">

<div class="top">
<button class="secondary" onclick="showPage('homePage')">
← Back
</button>
<h2>Profile</h2>
</div>

<div class="card">

<label>Worker ID</label>
<input id="profileWorkerId" readonly>

<label>Full Name</label>
<input id="profileName">

<label>Email</label>
<input id="profileEmail" readonly>

<label>Date of Birth</label>
<input id="profileDob" type="date">

<button onclick="saveProfile()">
Save Profile
</button>

<div id="profileMessage" class="message"></div>

</div>

</div>


<!-- SETTINGS -->

<div id="settingsPage" class="hidden">

<div class="top">
<button class="secondary" onclick="showPage('homePage')">
← Back
</button>
<h2>Settings</h2>
</div>

<div class="card">

<h3>Account Settings</h3>

<button onclick="showPage('profilePage');loadProfile()">
Profile
</button>

<button class="danger" onclick="logout()">
Logout
</button>

</div>

</div>

</div>

</div>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://ykswgkrmqsmdneobykri.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iED-0Op0GP8e1msvL7ksdw_53rXjJ_H";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
GLOBAL
========================= */

let currentUser = null;
let currentProfile = null;
let currentWallet = null;


/* =========================
HELPERS
========================= */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
AUTH SCREEN
========================= */

function showLogin(){

document.getElementById("loginBox")
.classList.remove("hidden");

document.getElementById("signupBox")
.classList.add("hidden");

}


function showSignup(){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("signupBox")
.classList.remove("hidden");

}


/* =========================
LOGIN
========================= */

async function login(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

const msg =
document.getElementById("loginMessage");


if(!email || !password){

msg.innerHTML =
'<div class="error">Enter email and password.</div>';

return;
}

msg.innerHTML =
'<div class="small">Logging in...</div>';


const {data,error} =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});


if(error){

msg.innerHTML =
'<div class="error">'+
escapeHtml(error.message)+
'</div>';

return;

}


currentUser = data.user;

await loadApp();

}


/* =========================
SIGNUP
========================= */

async function signup(){

const name =
document.getElementById("signupName")
.value.trim();

const email =
document.getElementById("signupEmail")
.value.trim();

const dob =
document.getElementById("signupDob")
.value;

const password =
document.getElementById("signupPassword")
.value;

const msg =
document.getElementById("signupMessage");


if(!name || !email || !dob || !password){

msg.innerHTML =
'<div class="error">Fill all fields.</div>';

return;
}


if(password.length < 6){

msg.innerHTML =
'<div class="error">Password must contain at least 6 characters.</div>';

return;
}


msg.innerHTML =
'<div class="small">Creating account...</div>';


const {data,error} =
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{
data:{
full_name:name,
date_of_birth:dob
}
}

});


if(error){

msg.innerHTML =
'<div class="error">'+
escapeHtml(error.message)+
'</div>';

return;

}


if(data.session){

currentUser = data.user;

await loadApp();

return;

}


msg.innerHTML =
'<div class="success">'+
"Account created. Check your email if verification is required."+
'</div>';

}


/* =========================
LOAD APP
========================= */

async function loadApp(){

if(!currentUser){

const result =
await supabaseClient.auth.getUser();

currentUser =
result.data.user;

}


if(!currentUser){
return;
}


document.getElementById("authBox")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");


await loadProfile();
await loadWallet();

showPage("homePage");

}


/* =========================
NAVIGATION
========================= */

function showPage(pageId){

const pages = [
"homePage",
"withdrawPage",
"transactionsPage",
"profilePage",
"settingsPage"
];


pages.forEach(function(id){

const page =
document.getElementById(id);

if(page){
page.classList.add("hidden");
}

});


const target =
document.getElementById(pageId);

if(target){
target.classList.remove("hidden");
}

}


/* =========================
PROFILE
========================= */

async function loadProfile(){

if(!currentUser){
return;
}


const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();


if(error){

console.error(error);

return;
}


currentProfile = data;


if(!data){
return;
}


document.getElementById("workerId")
.textContent =
data.worker_id || "---";

document.getElementById("profileWorkerId")
.value =
data.worker_id || "";

document.getElementById("profileName")
.value =
data.full_name || "";

document.getElementById("profileEmail")
.value =
currentUser.email || "";

document.getElementById("profileDob")
.value =
data.date_of_birth || "";

}


/* =========================
SAVE PROFILE
========================= */

async function saveProfile(){

if(!currentUser){
return;
}


const name =
document.getElementById("profileName")
.value.trim();

const dob =
document.getElementById("profileDob")
.value;

const msg =
document.getElementById("profileMessage");


if(!name || !dob){

msg.innerHTML =
'<div class="error">Fill all fields.</div>';

return;
}


msg.innerHTML =
'<div class="small">Saving...</div>';


const {error} =
await supabaseClient
.from("profiles")
.update({
full_name:name,
date_of_birth:dob
})
.eq("id",currentUser.id);


if(error){

msg.innerHTML =
'<div class="error">'+
escapeHtml(error.message)+
'</div>';

return;
}


msg.innerHTML =
'<div class="success">Profile saved.</div>';

await loadProfile();

}


/* =========================
WALLET
========================= */

async function loadWallet(){

if(!currentUser){
return;
}


const {data,error} =
await supabaseClient
.from("wallets")
.select("*")
.eq("user_id",currentUser.id)
.maybeSingle();


if(error){

console.error(error);

return;
}


currentWallet = data;


const amount =
Number(data?.balance || 0);


document.getElementById("balance")
.textContent =
amount.toFixed(2);

document.getElementById("withdrawBalance")
.textContent =
amount.toFixed(2);

}


/* =========================
PAYMENT METHOD
========================= */

function changePayment(){

const method =
document.querySelector(
'input[name="method"]:checked'
).value;


if(method === "upi"){

document.getElementById("upiBox")
.classList.remove("hidden");

document.getElementById("giftBox")
.classList.add("hidden");

}else{

document.getElementById("upiBox")
.classList.add("hidden");

document.getElementById("giftBox")
.classList.remove("hidden");

}

}


/* =========================
WITHDRAW
========================= */

async function withdraw(){

if(!currentUser){
return;
}


const amount =
Number(
document.getElementById("withdrawAmount")
.value
);


const method =
document.querySelector(
'input[name="method"]:checked'
).value;


const msg =
document.getElementById("withdrawMessage");


if(amount < 10){

msg.innerHTML =
'<div class="error">Minimum withdrawal is ₹10.</div>';

return;
}


const balance =
Number(currentWallet?.balance || 0);


if(amount > balance){

msg.innerHTML =
'<div class="error">Insufficient balance.</div>';

return;
}


let giftCardType = null;


if(method === "upi"){

const upi =
document.getElementById("upiId")
.value.trim();


if(!upi){

msg.innerHTML =
'<div class="error">Enter your UPI ID.</div>';

return;
}

/*
UPI ID will be added to the database
in the next security/database step.
*/

}else{

giftCardType =
document.getElementById("giftType")
.value;


if(!giftCardType){

msg.innerHTML =
'<div class="error">Select a gift card.</div>';

return;
}

}


msg.innerHTML =
'<div class="small">Submitting...</div>';


/*
Use the existing secure Supabase RPC.
*/

const {error} =
await supabaseClient.rpc(
"create_withdrawal",
{
p_amount:amount,
p_payment_method:method,
p_gift_card_type:giftCardType
}
);


if(error){

msg.innerHTML =
'<div class="error">'+
escapeHtml(error.message)+
'</div>';

return;
}


msg.innerHTML =
'<div class="success">'+
"Withdrawal request submitted successfully."+
'</div>';


document.getElementById("withdrawAmount")
.value = "";

document.getElementById("upiId")
.value = "";

document.getElementById("giftType")
.value = "";


}


/* =========================
TRANSACTIONS
========================= */

async function loadTransactions(){

if(!currentUser){
return;
}


const list =
document.getElementById("transactionList");


list.innerHTML =
'<div class="empty">Loading...</div>';


const {data,error} =
await supabaseClient
.from("transactions")
.select("*")
.eq("user_id",currentUser.id)
.order("created_at",{ascending:false})
.limit(50);


if(error){

list.innerHTML =
'<div class="error">'+
escapeHtml(error.message)+
'</div>';

return;
}


if(!data || data.length === 0){

list.innerHTML =
'<div class="empty">No transactions yet.</div>';

return;
}


list.innerHTML = "";


data.forEach(function(item){

const amount =
Number(item.amount || 0);

const credit =
item.type === "credit";

const div =
document.createElement("div");

div.className =
"transaction";

div.innerHTML =

'<div style="display:flex;justify-content:space-between;gap:10px">'+

'<strong>'+
escapeHtml(
item.description ||
(credit ? "Credit" : "Debit")
)+
'</strong>'+

'<span class="'+
(credit ? "credit" : "debit")+
'">'+

(credit ? "+" : "-")+
"₹"+
amount.toFixed(2)+

'</span>'+

'</div>'+

'<div class="small">'+
escapeHtml(
item.created_at
? new Date(item.created_at).toLocaleString()
: ""
)+
'</div>';

list.appendChild(div);

});

}


/* =========================
LOGOUT
========================= */

async function logout(){

await supabaseClient.auth.signOut();

currentUser = null;
