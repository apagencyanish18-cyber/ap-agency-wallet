<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AP Agency Wallet</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f6f9;
      color:#111827;
      min-height:100vh;
    }

    .hidden{
      display:none !important;
    }

    .container{
      width:100%;
      max-width:430px;
      margin:auto;
      padding:20px;
    }

    .logo{
      text-align:center;
      font-size:28px;
      font-weight:800;
      margin:25px 0 5px;
    }

    .subtitle{
      text-align:center;
      color:#6b7280;
      margin-bottom:25px;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:20px;
      box-shadow:0 5px 20px rgba(0,0,0,.08);
      margin-bottom:16px;
    }

    h2{
      margin-bottom:18px;
    }

    h3{
      margin-bottom:10px;
    }

    label{
      display:block;
      font-size:14px;
      font-weight:600;
      margin:12px 0 6px;
    }

    input,
    select{
      width:100%;
      padding:13px;
      border:1px solid #d1d5db;
      border-radius:10px;
      outline:none;
      font-size:15px;
    }

    input:focus,
    select:focus{
      border-color:#2563eb;
    }

    button{
      width:100%;
      padding:13px;
      border:0;
      border-radius:10px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      margin-top:12px;
    }

    .primary{
      background:#2563eb;
      color:white;
    }

    .secondary{
      background:#eef2ff;
      color:#1d4ed8;
    }

    .danger{
      background:#fee2e2;
      color:#b91c1c;
    }

    .link-btn{
      background:none;
      color:#2563eb;
      padding:5px;
    }

    .error{
      color:#dc2626;
      font-size:14px;
      margin-top:10px;
    }

    .success{
      color:#16a34a;
      font-size:14px;
      margin-top:10px;
    }

    .balance-card{
      background:#2563eb;
      color:white;
      border-radius:20px;
      padding:24px;
      margin-bottom:18px;
    }

    .balance-label{
      font-size:14px;
      opacity:.9;
    }

    .balance{
      font-size:35px;
      font-weight:800;
      margin-top:8px;
    }

    .worker-id{
      margin-top:10px;
      font-size:14px;
      opacity:.9;
    }

    .menu{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:18px;
    }

    .menu button{
      background:white;
      border:1px solid #e5e7eb;
      color:#111827;
      margin:0;
      min-height:65px;
    }

    .transaction{
      border-bottom:1px solid #eee;
      padding:12px 0;
    }

    .transaction:last-child{
      border-bottom:none;
    }

    .transaction-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
    }

    .credit{
      color:#16a34a;
      font-weight:700;
    }

    .debit{
      color:#dc2626;
      font-weight:700;
    }

    .small{
      font-size:12px;
      color:#6b7280;
      margin-top:4px;
    }

    .profile-photo{
      width:90px;
      height:90px;
      border-radius:50%;
      object-fit:cover;
      background:#e5e7eb;
      display:block;
      margin:0 auto 12px;
    }

    .center{
      text-align:center;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .topbar-title{
      font-size:21px;
      font-weight:800;
    }

    .logout-small{
      width:auto;
      padding:8px 12px;
      margin:0;
      background:#fee2e2;
      color:#b91c1c;
      font-size:12px;
    }

    .withdraw-box{
      background:#f8fafc;
      padding:15px;
      border-radius:12px;
      margin-top:12px;
    }

    .note{
      background:#fff7ed;
      color:#9a3412;
      padding:10px;
      border-radius:10px;
      font-size:13px;
      margin-top:10px;
    }

    .loading{
      text-align:center;
      padding:40px 10px;
      color:#6b7280;
    }
  </style>
</head>

<body>

<!-- ================= AUTH SCREEN ================= -->

<div id="authBox" class="container">

  <div class="logo">AP Agency</div>
  <div class="subtitle">Worker Wallet</div>

  <!-- LOGIN -->
  <div id="loginCard" class="card">

    <h2>Worker Login</h2>

    <label>Email</label>
    <input
      id="loginEmail"
      type="email"
      placeholder="Enter email"
    >

    <label>Password</label>
    <input
      id="loginPassword"
      type="password"
      placeholder="Enter password"
    >

    <button class="primary" onclick="login()">
      Login
    </button>

    <div id="loginMessage"></div>

    <button class="link-btn" onclick="showSignup()">
      Create New Account
    </button>

  </div>


  <!-- SIGNUP -->
  <div id="signupCard" class="card hidden">

    <h2>Create Worker Account</h2>

    <label>Full Name</label>
    <input
      id="signupName"
      type="text"
      placeholder="Enter full name"
    >

    <label>Email</label>
    <input
      id="signupEmail"
      type="email"
      placeholder="Enter email"
    >

    <label>Date of Birth</label>
    <input
      id="signupDob"
      type="date"
    >

    <label>Password</label>
    <input
      id="signupPassword"
      type="password"
      placeholder="Create password"
    >

    <button class="primary" onclick="signup()">
      Create Account
    </button>

    <div id="signupMessage"></div>

    <button class="link-btn" onclick="showLogin()">
      Already have an account? Login
    </button>

  </div>

</div>


<!-- ================= APP ================= -->

<div id="app" class="container hidden">

  <div class="topbar">

    <div class="topbar-title">
      AP Agency
    </div>

    <button
      class="logout-small"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <!-- HOME -->

  <div id="homePage">

    <div class="balance-card">

      <div class="balance-label">
        Available Balance
      </div>

      <div id="balance" class="balance">
        ₹0.00
      </div>

      <div id="workerId" class="worker-id">
        Worker ID: -
      </div>

    </div>


    <div class="menu">

      <button onclick="showPage('withdrawPage')">
        💸<br>
        Withdraw Fund
      </button>

      <button onclick="showPage('transactionsPage'); loadTransactions()">
        📜<br>
        Transaction History
      </button>

      <button onclick="showPage('profilePage'); loadProfile(currentUser)">
        👤<br>
        Profile
      </button>

      <button onclick="showPage('settingsPage')">
        ⚙️<br>
        Settings
      </button>

    </div>


    <div class="card">

      <h3>Welcome 👋</h3>

      <div id="welcomeText">
        Welcome to AP Agency.
      </div>

    </div>

  </div>


  <!-- WITHDRAW -->

  <div id="withdrawPage" class="hidden">

    <div class="card">

      <h2>Withdraw Fund</h2>

      <div class="note">
        Minimum withdrawal amount: ₹10
      </div>

      <label>Amount</label>

      <input
        id="withdrawAmount"
        type="number"
        min="10"
        placeholder="Enter amount"
      >


      <label>Payment Method</label>

      <select
        id="paymentMethod"
        onchange="paymentChanged()"
      >

        <option value="">
          Select payment method
        </option>

        <option value="upi">
          UPI
        </option>

        <option value="gift_card">
          Gift Card
        </option>

      </select>


      <div id="upiBox" class="withdraw-box hidden">

        <label>UPI ID</label>

        <input
          id="upiId"
          type="text"
          placeholder="example@upi"
        >

      </div>


      <div id="giftCardBox" class="withdraw-box hidden">

        <label>Gift Card</label>

        <select id="giftCardType">

          <option value="">
            Select gift card
          </option>

          <option value="amazon">
            Amazon
          </option>

          <option value="flipkart">
            Flipkart
          </option>

          <option value="google_play">
            Google Play
          </option>

        </select>

      </div>


      <button
        class="primary"
        onclick="withdraw()"
      >
        Submit Withdrawal
      </button>

      <div id="withdrawMessage"></div>

      <button
        class="secondary"
        onclick="showPage('homePage')"
      >
        Back
      </button>

    </div>

  </div>


  <!-- TRANSACTIONS -->

  <div id="transactionsPage" class="hidden">

    <div class="card">

      <h2>Transaction History</h2>

      <div id="transactions">
        <div class="loading">
          Loading...
        </div>
      </div>

      <button
        class="secondary"
        onclick="showPage('homePage')"
      >
        Back
      </button>

    </div>

  </div>


  <!-- PROFILE -->

  <div id="profilePage" class="hidden">

    <div class="card">

      <h2>My Profile</h2>

      <div class="center">

        <img
          id="profilePhoto"
          class="profile-photo"
          src="https://via.placeholder.com/90"
          alt="Profile"
        >

      </div>

      <label>Worker ID</label>

      <input
        id="profileWorkerId"
        type="text"
        readonly
      >

      <label>Full Name</label>

      <input
        id="profileName"
        type="text"
      >

      <label>Email</label>

      <input
        id="profileEmail"
        type="email"
        readonly
      >

      <label>Date of Birth</label>

      <input
        id="profileDob"
        type="date"
      >

      <button
        class="primary"
        onclick="saveProfile()"
      >
        Save Profile
      </button>

      <div id="profileMessage"></div>

      <button
        class="secondary"
        onclick="showPage('homePage')"
      >
        Back
      </button>

    </div>

  </div>


  <!-- SETTINGS -->

  <div id="settingsPage" class="hidden">

    <div class="card">

      <h2>Settings</h2>

      <p class="small">
        AP Agency Worker Wallet
      </p>

      <button
        class="danger"
        onclick="logout()"
      >
        Logout
      </button>

      <button
        class="secondary"
        onclick="showPage('homePage')"
      >
        Back
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://ykswgkrmqsmdneobykri.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_iED-0Op0GP8e1msvL7ksdw_53rXjJ_H";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL USER
===================================================== */

let currentUser = null;
let currentProfile = null;
let currentWallet = null;


/* =====================================================
   AUTH SCREEN
===================================================== */

function showSignup(){

  document
    .getElementById("loginCard")
    .classList.add("hidden");

  document
    .getElementById("signupCard")
    .classList.remove("hidden");

}


function showLogin(){

  document
    .getElementById("signupCard")
    .classList.add("hidden");

  document
    .getElementById("loginCard")
    .classList.remove("hidden");

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if(!email || !password){

    message.innerHTML =
      '<div class="error">Enter email and password.</div>';

    return;
  }

  message.innerHTML =
    '<div class="small">Logging in...</div>';

  try{

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if(error){
      throw error;
    }

    currentUser = data.user;

    await loadApp();

  }catch(error){

    console.error(error);

    message.innerHTML =
      '<div class="error">' +
      escapeHtml(error.message) +
      '</div>';

  }

}


/* =====================================================
   SIGNUP
===================================================== */

async function signup(){

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const dob =
    document
      .getElementById("signupDob")
      .value;

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const message =
    document.getElementById("signupMessage");

  message.innerHTML = "";

  if(!name || !email || !dob || !password){

    message.innerHTML =
      '<div class="error">Please fill all fields.</div>';

    return;
  }

  if(password.length < 6){

    message.innerHTML =
      '<div class="error">Password must be at least 6 characters.</div>';

    return;
  }

  message.innerHTML =
    '<div class="small">Creating account...</div>';

  try{

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options:{
          data:{
            full_name:name,
            date_of_birth:dob
          }
        }

      });

    if(error){
      throw error;
    }

    if(data.session){

      currentUser = data.user;

      await loadApp();

    }else{

      message.innerHTML =
        '<div class="success">' +
        'Account created. Please confirm your email if required, then login.' +
        '</div>';

    }

  }catch(error){

    console.error(error);

    message.innerHTML =
      '<div class="error">' +
      escapeHtml(error.message) +
      '</div>';

  }

}


/* =====================================================
   LOAD APP
===================================================== */

async function loadApp(){

  try{

    if(!currentUser){

      const {
        data,
        error
      } = await supabaseClient.auth.getUser();

      if(error){
        throw error;
      }

      currentUser = data.user;

    }

    if(!currentUser){
      return;
    }


    await loadProfile(currentUser);

    await loadWallet();

    await loadTransactions();


    document
      .getElementById("authBox")
      .classList.add("hidden");

    document
      .getElementById("app")
      .classList.remove("hidden");

    showPage("homePage");

  }catch(error){

    console.error("LOAD APP ERROR:",error);

    document
      .getElementById("authBox")
      .classList.remove("hidden");

    document
      .getElementById("app")
      .classList.add("hidden");

    alert(
      "Could not load account: " +
      error.message
    );

  }

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(user){

  if(!user){
    return;
  }

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if(error){

    console.error("PROFILE ERROR:",error);

    throw error;

  }

  currentProfile = data;


  document
    .getElementById("workerId")
    .textContent =
      "Worker ID: " +
      (data.worker_id || "-");


  document
    .getElementById("welcomeText")
    .textContent =
      "Welcome, " +
      (data.full_name || "Worker") +
      "!";


  document
    .getElementById("profileWorkerId")
    .value =
      data.worker_id || "";


  document
    .getElementById("profileName")
    .value =
      data.full_name || "";


  document
    .getElementById("profileEmail")
    .value =
      user.email || "";


  document
    .getElementById("profileDob")
    .value =
      data.date_of_birth || "";


  if(data.avatar_url){

    document
      .getElementById("profilePhoto")
      .src =
        data.avatar_url;

  }

}


/* =====================================================
   LOAD WALLET
===================================================== */

async function loadWallet(){

  const {
    data,
    error
  } = await supabaseClient
    .from("wallets")
    .select("*")
    .eq("user_id", currentUser.id)
    .single();

  if(error){

    console.error("WALLET ERROR:",error);

    throw error;

  }

  currentWallet = data;


  document
    .getElementById("balance")
    .textContent =
      "₹" +
      Number(data.balance || 0)
        .toFixed(2);

}


/* =====================================================
   LOAD TRANSACTIONS
===================================================== */

async function loadTransactions(){

  if(!currentUser){
    return;
  }

  const box =
    document.getElementById("transactions");

  box.innerHTML =
    '<div class="loading">Loading...</div>';


  const {
    data,
    error
  } = await supabaseClient
    .from("transactions")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending:false
    });


  if(error){

    console.error(error);

    box.innerHTML =
      '<div class="error">' +
      escapeHtml(error.message) +
      '</div>';

    return;

  }


  if(!data || data.length === 0){

    box.innerHTML =
      '<div class="small">No transactions yet.</div>';

    return;

  }


  box.innerHTML = "";


  data.forEach(tx => {

    const div =
      document.createElement("div");

    div.className =
      "transaction";


    const type =
      tx.type === "credit"
        ? "credit"
        : "debit";


    const sign =
      tx.type === "credit"
        ? "+"
        : "-";


    const date =
      tx.created_at
        ? new Date(tx.created_at)
            .toLocaleString()
        : "";


    div.innerHTML = `

      <div class="transaction-top">

        <div>
          <strong>
            ${escapeHtml(
              tx.description || "Transaction"
            )}
          </strong>

          <div class="small">
            ${escapeHtml(date)}
          </div>
        </div>

        <div class="${type}">
          ${sign}₹${Number(tx.amount || 0).toFixed(2)}
        </div>

      </div>

      ${
        tx.balance_after !== null &&
        tx.balance_after !== undefined
        ? `
          <div class="small">
            Balance: ₹${Number(
              tx.balance_after
            ).toFixed(2)}
          </div>
        `
        : ""
      }

    `;


    box.appendChild(div);

  });

}


/* =====================================================
   PAYMENT METHOD
===================================================== */

function paymentChanged(){

  const method =
    document
      .getElementById("paymentMethod")
      .value;


  const upiBox =
    document.getElementById("upiBox");

  const giftBox =
    document.getElementById("giftCardBox");


  upiBox.classList.add("hidden");

  giftBox.classList.add("hidden");


  if(method === "upi"){

    upiBox.classList.remove("hidden");

  }


  if(method === "gift_card"){

    giftBox.classList.remove("hidden");

  }

}


/* =====================================================
   WITHDRAW
===================================================== */

async function withdraw(){

  const message =
    document.getElementById("withdrawMessage");

  message.innerHTML = "";


  const amount =
    Number(
      document
        .getElementById("withdrawAmount")
        .value
    );


  const method =
    document
      .getElementById("paymentMethod")
      .value;


  const upi =
    document
      .getElementById("upiId")
      .value
      .trim();

    return;
  }

  msg.textContent =
    "Withdrawal request submitted successfully.";

  document.getElementById("withdrawAmount").value="";
  document.getElementById("paymentMethod").value="";
  document.getElementById("upiId").value="";
  document.getElementById("giftCardType").value="";

  paymentChanged();

  await loadWallet(user.id);
  await loadTransactions(user.id);
}


/* ---------------- SECURITY ---------------- */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ---------------- SESSION ---------------- */

supabaseClient.auth.onAuthStateChange(
  async (event,session)=>{

    if(session){
      await loadApp();
    }

  }
);


/* INITIAL CHECK */

(async function(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  if(session){
    await loadApp();
  }

})();

</script>

</body>
      </html>
