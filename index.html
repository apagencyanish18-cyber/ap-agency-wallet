<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://ykswgkrmqsmdneobykri.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_iED-0Op0GP8e1msvL7ksdw_53rXjJ_H";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL USER
===================================================== */

let currentUser = null;
let currentProfile = null;
let currentWallet = null;


/* =====================================================
   AUTH SCREEN
===================================================== */

function showSignup(){

  document
    .getElementById("loginCard")
    .classList.add("hidden");

  document
    .getElementById("signupCard")
    .classList.remove("hidden");

}


function showLogin(){

  document
    .getElementById("signupCard")
    .classList.add("hidden");

  document
    .getElementById("loginCard")
    .classList.remove("hidden");

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if(!email || !password){

    message.innerHTML =
      '<div class="error">Enter email and password.</div>';

    return;
  }

  message.innerHTML =
    '<div class="small">Logging in...</div>';

  try{

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if(error){
      throw error;
    }

    currentUser = data.user;

    await loadApp();

  }catch(error){

    console.error(error);

    message.innerHTML =
      '<div class="error">' +
      escapeHtml(error.message) +
      '</div>';

  }

}


/* =====================================================
   SIGNUP
===================================================== */

async function signup(){

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const dob =
    document
      .getElementById("signupDob")
      .value;

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const message =
    document.getElementById("signupMessage");

  message.innerHTML = "";

  if(!name || !email || !dob || !password){

    message.innerHTML =
      '<div class="error">Please fill all fields.</div>';

    return;
  }

  if(password.length < 6){

    message.innerHTML =
      '<div class="error">Password must be at least 6 characters.</div>';

    return;
  }

  message.innerHTML =
    '<div class="small">Creating account...</div>';

  try{

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options:{
          data:{
            full_name:name,
            date_of_birth:dob
          }
        }

      });

    if(error){
      throw error;
    }

    if(data.session){

      currentUser = data.user;

      await loadApp();

    }else{

      message.innerHTML =
        '<div class="success">' +
        'Account created. Please confirm your email if required, then login.' +
        '</div>';

    }

  }catch(error){

    console.error(error);

    message.innerHTML =
      '<div class="error">' +
      escapeHtml(error.message) +
      '</div>';

  }

}


/* =====================================================
   LOAD APP
===================================================== */

async function loadApp(){

  try{

    if(!currentUser){

      const {
        data,
        error
      } = await supabaseClient.auth.getUser();

      if(error){
        throw error;
      }

      currentUser = data.user;

    }

    if(!currentUser){
      return;
    }


    await loadProfile(currentUser);

    await loadWallet();

    await loadTransactions();


    document
      .getElementById("authBox")
      .classList.add("hidden");

    document
      .getElementById("app")
      .classList.remove("hidden");

    showPage("homePage");

  }catch(error){

    console.error("LOAD APP ERROR:",error);

    document
      .getElementById("authBox")
      .classList.remove("hidden");

    document
      .getElementById("app")
      .classList.add("hidden");

    alert(
      "Could not load account: " +
      error.message
    );

  }

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(user){

  if(!user){
    return;
  }

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if(error){

    console.error("PROFILE ERROR:",error);

    throw error;

  }

  currentProfile = data;


  document
    .getElementById("workerId")
    .textContent =
      "Worker ID: " +
      (data.worker_id || "-");


  document
    .getElementById("welcomeText")
    .textContent =
      "Welcome, " +
      (data.full_name || "Worker") +
      "!";


  document
    .getElementById("profileWorkerId")
    .value =
      data.worker_id || "";


  document
    .getElementById("profileName")
    .value =
      data.full_name || "";


  document
    .getElementById("profileEmail")
    .value =
      user.email || "";


  document
    .getElementById("profileDob")
    .value =
      data.date_of_birth || "";


  if(data.avatar_url){

    document
      .getElementById("profilePhoto")
      .src =
        data.avatar_url;

  }

}


/* =====================================================
   LOAD WALLET
===================================================== */

async function loadWallet(){

  const {
    data,
    error
  } = await supabaseClient
    .from("wallets")
    .select("*")
    .eq("user_id", currentUser.id)
    .single();

  if(error){

    console.error("WALLET ERROR:",error);

    throw error;

  }

  currentWallet = data;


  document
    .getElementById("balance")
    .textContent =
      "₹" +
      Number(data.balance || 0)
        .toFixed(2);

}


/* =====================================================
   LOAD TRANSACTIONS
===================================================== */

async function loadTransactions(){

  if(!currentUser){
    return;
  }

  const box =
    document.getElementById("transactions");

  box.innerHTML =
    '<div class="loading">Loading...</div>';


  const {
    data,
    error
  } = await supabaseClient
    .from("transactions")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending:false
    });


  if(error){

    console.error(error);

    box.innerHTML =
      '<div class="error">' +
      escapeHtml(error.message) +
      '</div>';

    return;

  }


  if(!data || data.length === 0){

    box.innerHTML =
      '<div class="small">No transactions yet.</div>';

    return;

  }


  box.innerHTML = "";


  data.forEach(tx => {

    const div =
      document.createElement("div");

    div.className =
      "transaction";


    const type =
      tx.type === "credit"
        ? "credit"
        : "debit";


    const sign =
      tx.type === "credit"
        ? "+"
        : "-";


    const date =
      tx.created_at
        ? new Date(tx.created_at)
            .toLocaleString()
        : "";


    div.innerHTML = `

      <div class="transaction-top">

        <div>
          <strong>
            ${escapeHtml(
              tx.description || "Transaction"
            )}
          </strong>

          <div class="small">
            ${escapeHtml(date)}
          </div>
        </div>

        <div class="${type}">
          ${sign}₹${Number(tx.amount || 0).toFixed(2)}
        </div>

      </div>

      ${
        tx.balance_after !== null &&
        tx.balance_after !== undefined
        ? `
          <div class="small">
            Balance: ₹${Number(
              tx.balance_after
            ).toFixed(2)}
          </div>
        `
        : ""
      }

    `;


    box.appendChild(div);

  });

}

   PAYMENT METHOD
===================================================== */

/* ---------------- SECURITY ---------------- */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ---------------- SESSION ---------------- */

supabaseClient.auth.onAuthStateChange(
  async (event,session)=>{

    if(session){
      await loadApp();
    }

  }
);


/* INITIAL CHECK */

(async function(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  if(session){

  }

})();

</script>
