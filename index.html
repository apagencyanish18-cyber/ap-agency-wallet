<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP AGENCY WALLET</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --subtext: #64748b;
            --primary: #1d4ed8;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --subtext: #94a3b8;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; font-family: sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 16px; }
        .hidden { display: none !important; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 16px; border-radius: 16px; box-shadow: var(--card-shadow); margin-bottom: 20px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .title { font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px; }
        .subtitle { font-size: 11px; color: var(--subtext); }
        .theme-toggle { background: var(--bg-color); border: none; font-size: 20px; cursor: pointer; padding: 8px 12px; border-radius: 50%; color: var(--text-color); }

        .balance-card { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 24px; position: relative; }
        .wallet-tag { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-size: 12px; }
        .balance-amount { font-size: 32px; font-weight: bold; margin: 12px 0; }
        .worker-id { background: rgba(0,0,0,0.2); display: inline-block; padding: 6px 12px; border-radius: 8px; font-size: 13px; }

        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .action-btn { background: var(--card-bg); padding: 16px; border-radius: 16px; text-align: center; border: none; color: var(--text-color); font-weight: 600; cursor: pointer; box-shadow: var(--card-shadow); }
        .action-icon { font-size: 24px; margin-bottom: 8px; display: block; }

        .welcome-card { background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: var(--card-shadow); }
        .input-field { width: 100%; padding: 12px; margin: 8px 0 16px; border-radius: 8px; border: 1px solid var(--subtext); background: var(--bg-color); color: var(--text-color); }
        .btn-primary { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="authBox" class="welcome-card" style="max-width: 400px; margin: 40px auto;">
    <h2>Login / Signup</h2>
    <input type="email" id="emailInput" class="input-field" placeholder="Email">
    <input type="password" id="passInput" class="input-field" placeholder="Password">
    <button id="loginBtn" class="btn-primary" style="margin-bottom: 8px;">Login</button>
    <button id="signupBtn" class="btn-primary" style="background: #475569;">Signup</button>
</div>

<div id="app" class="hidden">
    <div class="header">
        <div class="header-left">
            <img src="file_00000000e37481fabb8b78aea4e71cd6.png" class="logo" alt="Logo">
            <div>
                <div class="title">AP AGENCY</div>
                <div class="subtitle">TOGETHER WE GROW</div>
            </div>
        </div>
        <button id="themeToggleBtn" class="theme-toggle">🌙</button>
    </div>

    <div class="balance-card">
        <span class="wallet-tag">Worker Wallet</span>
        <div style="font-size: 12px; opacity: 0.8;">AVAILABLE BALANCE</div>
        <div class="balance-amount">₹<span id="balanceText">0.00</span></div>
        <div class="worker-id">Worker ID: <span id="workerIdText">AP000000</span></div>
    </div>

    <div class="actions-grid">
        <button id="withdrawBtn" class="action-btn"><span class="action-icon">💸</span>Withdraw Fund</button>
        <button id="historyBtn" class="action-btn"><span class="action-icon">📋</span>Transaction History</button>
        <button id="profileBtn" class="action-btn"><span class="action-icon">👤</span>My Profile</button>
        <button id="settingsLogoutBtn" class="action-btn"><span class="action-icon">🚪</span>Logout</button>
    </div>

    <div class="welcome-card">
        <h3 style="margin:0 0 8px 0;">Welcome 👋</h3>
        <p style="margin:0; color:var(--subtext);">Welcome back, <span id="userNameText">Worker</span>!</p>
    </div>
</div>
<script>
    const SUPABASE_URL = "https://ykswgkrmqsmdneobykri.supabase.co";
    const SUPABASE_KEY = "sb_publishable_iED-0Op0GP8e1msvL7ksdw_53rXjJ_H";
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const $ = selector => document.querySelector(selector);

    // Dark/Light Mode Switcher
    const themeBtn = $("#themeToggleBtn");
    if(themeBtn) {
        themeBtn.onclick = () => {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            themeBtn.innerText = isDark ? "☀️" : "🌙";
        };
    }

    let currentUser = null;

    async function login() {
        const email = $("#emailInput").value;
        const password = $("#passInput").value;
        if (!email || !password) return alert("Fill all fields");
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
        else initApp(data.user);
    }

    async function signup() {
        const email = $("#emailInput").value;
        const password = $("#passInput").value;
        if (!email || !password) return alert("Fill all fields");
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) alert(error.message);
        else alert("Signup successful! Please login.");
    }

    async function logout() {
        if (supabaseClient) await supabaseClient.auth.signOut();
        currentUser = null;
        $("#app").classList.add("hidden");
        $("#authBox").classList.remove("hidden");
    }

    function initApp(user) {
        currentUser = user;
        $("#authBox").classList.add("hidden");
        $("#app").classList.remove("hidden");
        $("#userNameText").innerText = user.email ? user.email.split('@')[0] : "Worker";
    }

    document.addEventListener("DOMContentLoaded", () => {
        if ($("#loginBtn")) $("#loginBtn").onclick = login;
        if ($("#signupBtn")) $("#signupBtn").onclick = signup;
        if ($("#settingsLogoutBtn")) $("#settingsLogoutBtn").onclick = logout;

        if (supabaseClient) {
            supabaseClient.auth.getSession().then(({ data }) => {
                if (data && data.session) {
                    initApp(data.session.user);
                }
            });
        }
    });
</script>
</body>
</html>
