<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Agency Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:18px 20px;
}

header h2{
  margin:0;
  font-size:22px;
}

header p{
  margin:5px 0 0;
  color:#b9c1d0;
  font-size:13px;
}

.container{
  max-width:520px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.balance{
  background:linear-gradient(135deg,#2563eb,#0d9488);
  color:white;
}

.balance small{
  opacity:.85;
}

.balance h1{
  margin:8px 0 0;
  font-size:34px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#f4b400;
  color:#111;
}

.secondary{
  background:#eef2ff;
  color:#334155;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:1px solid #d7dce5;
  border-radius:10px;
  font-size:15px;
}

label{
  font-size:13px;
  font-weight:bold;
}

.hidden{
  display:none;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.row button{
  flex:1;
}

.tx{
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.tx:last-child{
  border-bottom:0;
}

.credit{
  color:#059669;
}

.debit{
  color:#dc2626;
}

.notice{
  padding:12px;
  border-radius:10px;
  background:#fff7ed;
  color:#9a3412;
  margin-bottom:12px;
  font-size:13px;
}

.profile-img{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  background:#e5e7eb;
}

.center{
  text-align:center;
}

.small{
  font-size:12px;
  color:#64748b;
}
</style>
</head>

<body>

<header>
  <h2>AP Agency Wallet</h2>
  <p>Worker Wallet Management System</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="authBox" class="card">

  <h3>Worker Login</h3>

  <div id="loginForm">

    <label>Email</label>
    <input
      id="loginEmail"
      type="email"
      placeholder="Enter email"
    >

    <label>Password</label>
    <input
      id="loginPassword"
      type="password"
      placeholder="Enter password"
    >

    <button class="primary" onclick="login()">
      Login
    </button>

    <br><br>

    <button class="secondary" onclick="showSignup()">
      Create Worker Account
    </button>

  </div>


  <div id="signupForm" class="hidden">

    <label>Full Name</label>
    <input
      id="signupName"
      placeholder="Full name"
    >

    <label>Email</label>
    <input
      id="signupEmail"
      type="email"
      placeholder="Email"
    >

    <label>Date of Birth</label>
    <input
      id="signupDob"
      type="date"
    >

    <label>Password</label>
    <input
      id="signupPassword"
      type="password"
      placeholder="Password"
    >

    <button class="primary" onclick="signup()">
      Create Account
    </button>

    <br><br>

    <button class="secondary" onclick="showLogin()">
      Back to Login
    </button>

  </div>

  <p id="authMsg" class="small"></p>

</div>


<!-- APP -->
<div id="app" class="hidden">

  <!-- BALANCE -->
  <div class="card balance">

    <small>Your Balance</small>

    <h1 id="balance">
      ₹0.00
    </h1>

    <p id="workerId" class="small"></p>

  </div>


  <!-- WITHDRAW -->
  <div class="card">

    <h3>Withdraw Fund</h3>

    <div class="notice">
      Minimum withdrawal amount: ₹10
    </div>

    <label>Amount</label>

    <input
      id="withdrawAmount"
      type="number"
      min="10"
      placeholder="Enter amount"
    >

    <label>Payment Method</label>

    <select
      id="paymentMethod"
      onchange="paymentChanged()"
    >

      <option value="">
        Select method
      </option>

      <option value="upi">
        UPI
      </option>

      <option value="gift_card">
        Gift Card
      </option>

    </select>


    <div id="upiBox" class="hidden">

      <label>UPI ID</label>

      <input
        id="upiId"
        placeholder="example@upi"
      >

    </div>


    <div id="giftBox" class="hidden">

      <label>Gift Card Type</label>

      <select id="giftCardType">

        <option value="">
          Select gift card
        </option>

        <option value="amazon">
          Amazon
        </option>

        <option value="flipkart">
          Flipkart
        </option>

        <option value="google_play">
          Google Play
        </option>

      </select>

    </div>


    <button
      class="primary"
      onclick="withdraw()"
    >
      Withdraw
    </button>

    <p
      id="withdrawMsg"
      class="small"
    ></p>

  </div>


  <!-- TRANSACTIONS -->
  <div class="card">

    <h3>Transaction History</h3>

    <div id="transactions">
      Loading...
    </div>

  </div>


  <!-- PROFILE -->
  <div class="card">

    <h3>My Profile</h3>

    <div class="center">

      <img
        id="avatar"
        class="profile-img"
        src=""
        alt="Profile"
      >

    </div>

    <p>
      <b>Name:</b>
      <span id="profileName">-</span>
    </p>

    <p>
      <b>Email:</b>
      <span id="profileEmail">-</span>
    </p>

    <p>
      <b>Worker ID:</b>
      <span id="profileWorkerId">-</span>
    </p>

    <p>
      <b>Date of Birth:</b>
      <span id="profileDob">-</span>
    </p>

    <button
      class="danger"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://ykswgkrmqsmdneobykri.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iED-0Op0GP8e1msvL7ksdw_53rXjJ_H";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   AUTH SCREEN
================================ */

function showSignup(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("signupForm")
    .classList.remove("hidden");
}


function showLogin(){

  document
    .getElementById("signupForm")
    .classList.add("hidden");

  document
    .getElementById("loginForm")
    .classList.remove("hidden");
}


function setAuthMsg(msg){

  document
    .getElementById("authMsg")
    .textContent = msg;
}


/* ================================
   SIGNUP
================================ */

async function signup(){

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const dob =
    document
      .getElementById("signupDob")
      .value;

  const password =
    document
      .getElementById("signupPassword")
      .value;


  if(!name || !email || !dob || !password){

    setAuthMsg(
      "Please fill all fields."
    );

    return;
  }


  if(password.length < 6){

    setAuthMsg(
      "Password must be at least 6 characters."
    );

    return;
  }


  setAuthMsg(
    "Creating account..."
  );


  const {data,error} =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {

        data: {

          full_name: name,

          date_of_birth: dob

        }

      }

    });


  if(error){

    setAuthMsg(
      error.message
    );

    return;
  }


  if(!data.user){

    setAuthMsg(
      "Account created. Please login."
    );

    showLogin();

    return;
  }


  setAuthMsg(
    "Account created successfully. You can now login."
  );


  showLogin();
}


/*scription || tx.type || "Transaction")}</b>
          <br>
          <span class="${positive ? "credit":"debit"}">
            ${positive ? "+" : "-"}₹${amount.toFixed(2)}
          </span>
          <br>
          <span class="small">
            ${new Date(tx.created_at).toLocaleString()}
          </span>
        </div>
      `;

    }).join("");
}


/* ---------------- PAYMENT METHOD ---------------- */

function paymentChanged(){

  const method =
    document.getElementById("paymentMethod").value;

  document.getElementById("upiBox")
    .classList.toggle("hidden",method !== "upi");

  document.getElementById("giftBox")
    .classList.toggle("hidden",method !== "gift_card");
}


/* ---------------- WITHDRAW ---------------- */

async function withdraw(){

  const amount =
    Number(document.getElementById("withdrawAmount").value);

  const method =
    document.getElementById("paymentMethod").value;

  const upi =
    document.getElementById("upiId").value.trim();

  const gift =
    document.getElementById("giftCardType").value;

  const msg =
    document.getElementById("withdrawMsg");

  if(amount < 10){
    msg.textContent =
      "Minimum withdrawal is ₹10.";
    return;
  }

  if(!method){
    msg.textContent =
      "Select a payment method.";
    return;
  }

  if(method === "upi" && !upi){
    msg.textContent =
      "Enter your UPI ID.";
    return;
  }

  if(method === "gift_card" && !gift){
    msg.textContent =
      "Select a gift card type.";
    return;
  }

  const {
    data:{user}
  } = await supabaseClient.auth.getUser();

  if(!user){
    msg.textContent =
      "Please login again.";
    return;
  }

  msg.textContent =
    "Submitting withdrawal...";

  /*
    IMPORTANT:
    Withdrawal should be processed by the
    Supabase database/RPC with balance validation.
    This request creates the withdrawal record.
  */

  const {error} =
    await supabaseClient
      .from("withdrawals")
      .insert({
        user_id:user.id,
        amount:amount,
        upi_id:method === "upi" ? upi : null,
        status:"pending"
      });

  if(error){
    msg.textContent =
      error.message;
    return;
  }

  msg.textContent =
    "Withdrawal request submitted successfully.";

  document.getElementById("withdrawAmount").value="";
  document.getElementById("paymentMethod").value="";
  document.getElementById("upiId").value="";
  document.getElementById("giftCardType").value="";

  paymentChanged();

  await loadWallet(user.id);
  await loadTransactions(user.id);
}


/* ---------------- SECURITY ---------------- */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ---------------- SESSION ---------------- */

supabaseClient.auth.onAuthStateChange(
  async (event,session)=>{

    if(session){
      await loadApp();
    }

  }
);


/* INITIAL CHECK */

(async function(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  if(session){
    await loadApp();
  }

})();

</script>

</body>
      </html>
